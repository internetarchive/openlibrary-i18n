name: Weblate translation review

# Patron translation PRs (head branch `weblate`) get an agentic safety/quality
# review and, if it passes, auto-merge. Split into two jobs on purpose:
#
#   review   runs the agent with READ-ONLY permissions. The translation diff is
#            attacker-controllable, so a prompt-injected agent must have no power
#            to act -- in this job its token cannot write, comment, push or merge.
#            It only reads the diff and writes a verdict file (data).
#
#   enforce  runs NO agent. It performs every privileged action deterministically,
#            gated on THREE things, all required:
#              1. the agent verdict is "safe"           (scripts/weblate_review_guard.py)
#              2. the diff is translation-only           (scripts/weblate_review_guard.py)
#              3. the other required checks are green     (scripts/merge_gate.py)
#            Both scripts are unit-tested. The job FAILS CLOSED: a missing or
#            malformed verdict parses as "unknown" and never merges.
#
# This is the ONLY automation permitted to merge a `weblate` PR; translate.yml and
# reconcile.yml are scoped to i18n/ai-* and cannot touch it. See
# weblate-review-instructions.md for the review criteria.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Only translation PRs. This keeps the review agent from firing on unrelated
    # PRs (e.g. a workflow or script change -- including this file's own PR), which
    # the blast-radius guard would block from merging anyway but need not pay an
    # agent run for. A PR that touches locale/** plus other files still triggers;
    # the guard then blocks the merge on the non-translation files.
    paths:
      - 'locale/**'

concurrency:
  group: weblate-review-${{ github.event.pull_request.number }}
  # NOT cancel-in-progress. The enforce job pushes a resolution commit back to the
  # PR branch and then merges in the same run; cancelling a run mid-merge (which an
  # hourly Weblate push would do under cancel-in-progress) could orphan a push. The
  # pipeline is fast (checks run in-job, no 6h watch-hang), so queued runs drain
  # quickly, and the resolve step is idempotent, so a queued run on an
  # already-healed PR is a no-op.
  cancel-in-progress: false

jobs:
  review:
    # Run on translation PRs that need the untrusted-contributor gate: the recurring
    # Weblate sync branch, OR any same-repo PR NOT authored by openlibrary-bot (a
    # staff member pushing a translation branch directly). The bot's own i18n/ai-*
    # batches are excluded (they have their own gate in translate.yml/reconcile.yml),
    # as is the auto-heal resolution push ([skip ci] in its commit message skips the
    # whole run). FORK PRs are deliberately NOT handled here: a `pull_request` from a
    # fork receives no secrets, so neither the review agent's token nor OL_BOT_PAT is
    # available — fork coverage needs a `pull_request_target` design (a security
    # decision, held for Mek). See weblate-review-instructions.md.
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      (github.head_ref == 'weblate' ||
       github.event.pull_request.user.login != 'openlibrary-bot')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the translation diff for the agent
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff "origin/${{ github.base_ref }}...HEAD" -- 'locale/*/messages.po' > pr.diff
          echo "diff lines: $(wc -l < pr.diff)"

      - name: Agentic review (verdict only; read-only job)
        uses: anthropics/claude-code-action@v1
        with:
          prompt: "@weblate-review-instructions.md"
          # Pinned model id: see translate.yml for why the id is pinned, not left
          # to the CLI default. The agent only needs to read pr.diff and write
          # review-verdict.json; this job's read-only token is what actually
          # confines it, not the permission mode.
          claude_args: "--max-turns 40 --model claude-sonnet-5 --permission-mode acceptEdits"
          show_full_output: true
          claude_code_oauth_token: ${{ secrets.OL_BOT_CLAUDE_OAUTH_TOKEN }}

      - name: Fail closed if the agent produced no verdict
        if: always()
        run: |
          if [ ! -f review-verdict.json ]; then
            echo '{"verdict":"unknown","summary":"The review agent did not produce a verdict; failing closed (no auto-merge)."}' > review-verdict.json
          fi
          echo "verdict file:"; cat review-verdict.json

      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weblate-review-verdict
          path: review-verdict.json

  enforce:
    needs: review
    if: >-
      always() && needs.review.result != 'skipped' &&
      github.event.pull_request.head.repo.fork == false &&
      (github.head_ref == 'weblate' ||
       github.event.pull_request.user.login != 'openlibrary-bot')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.OL_BOT_PAT }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.OL_BOT_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install babel pytest

      - name: Download verdict
        uses: actions/download-artifact@v4
        with:
          name: weblate-review-verdict
        continue-on-error: true

      - name: Fail closed if no verdict artifact
        run: |
          if [ ! -f review-verdict.json ]; then
            echo '{"verdict":"unknown","summary":"No verdict artifact was produced; failing closed (no auto-merge)."}' > review-verdict.json
          fi
          echo "verdict:"; cat review-verdict.json

      - name: Compute changed files
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed-files.txt
          echo "changed files:"; cat changed-files.txt

      - name: Post review comment
        run: |
          python - <<'PY'
          import json, os, subprocess
          try:
              d = json.load(open("review-verdict.json"))
              if not isinstance(d, dict):
                  raise ValueError
          except Exception:
              d = {"verdict": "unknown", "summary": "Could not read the review verdict."}
          verdict = str(d.get("verdict", "unknown"))
          summary = str(d.get("summary", ""))
          issues = d.get("issues") if isinstance(d.get("issues"), list) else []
          lines = [f"**Agentic translation review: `{verdict}`**", "", summary]
          for it in issues[:10]:
              if isinstance(it, dict):
                  lines.append(f"- `{it.get('lang','?')}` {it.get('msgid','')}: {it.get('problem','')}")
          if verdict != "safe":
              lines += ["", "_This PR stays open for human review until the issues above are resolved._"]
          body = "\n".join(l for l in lines if l is not None)
          subprocess.run(["gh", "pr", "comment", os.environ["PR"], "--body", body], check=False)
          PY

      - name: Enforce verdict + blast-radius gate
        id: guard
        run: |
          python scripts/weblate_review_guard.py \
            --verdict-file review-verdict.json \
            --changed-files changed-files.txt

      - name: Auto-heal (resolve conflicts + repair CI) then merge
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # The guard (agent verdict == safe + diff is translation-only) has passed,
          # so the content is cleared to land. Everything below is deterministic and
          # runs no agent.
          #
          # Mek's spec: a safe translation PR must not sit. If it conflicts, resolve
          # it here; if CI would fail, repair it here; then merge -- all hands-free.
          # We run the SAME checks CI runs (./i18n validate / check-scope / test) in
          # THIS job rather than pushing and watching external checks, which is what
          # used to hang on `gh pr checks --watch` until GitHub's 6h timeout.
          git config user.name  "Open Library Bot"
          git config user.email "50213894+openlibrary-bot@users.noreply.github.com"
          git fetch origin "$BASE_REF"
          chmod +x ./i18n

          # Languages this PR actually touched (empty => nothing to do).
          mapfile -t LANGS < <(sed -n 's#^locale/\([^/]*\)/messages\.po$#\1#p' changed-files.txt | sort -u)
          if [ "${#LANGS[@]}" -eq 0 ]; then
            echo "No locale/*/messages.po in the diff; nothing to merge via auto-heal."
            exit 0
          fi
          echo "Languages: ${LANGS[*]}"

          # Overlay each language's incoming translations onto the CURRENT base
          # catalog (loses nothing; see `./i18n resolve`), then repair + compile.
          for lang in "${LANGS[@]}"; do
            incoming="$(mktemp)"
            git show "HEAD:locale/$lang/messages.po" > "$incoming"
            ./i18n resolve "$lang" "$incoming" --base "origin/$BASE_REF"
            ./i18n fix "$lang" || true          # repair HTML/format/plural defects
            if ! ./i18n validate "$lang"; then  # if repair could not clear it, hold
              gh pr comment "$PR" --body "Auto-heal ran but \`$lang\` still has format-string errors \`./i18n fix\` could not repair; leaving this PR open for a human. (Review verdict was \`safe\`; this is a mechanical gate.)"
              exit 0
            fi
            ./i18n compile "$lang"              # openlibrary-i18n tracks .mo
          done

          # Keep the PR scoped to the languages it translated, then run the same
          # gates CI runs. If any fail, STOP: leave the PR open with an explanation
          # rather than merging something red.
          ./i18n isolate "${LANGS[@]}" --base "origin/$BASE_REF"
          if ! ./i18n check-scope --base "origin/$BASE_REF"; then
            gh pr comment "$PR" --body "Auto-heal ran but \`check-scope\` still fails after repair; leaving this PR open for a human. (The review verdict was \`safe\`; this is a mechanical gate, not a content concern.)"
            exit 0
          fi
          for lang in "${LANGS[@]}"; do
            if ! ./i18n test "$lang"; then
              gh pr comment "$PR" --body "Auto-heal ran but the \`$lang\` PO tests still fail after repair; leaving this PR open for a human."
              exit 0
            fi
          done

          # In-job preflight passed. If resolution changed the tree, push it back to
          # the PR branch so the FULL required CI runs on the healed head -- in
          # particular "Verify translations deploy cleanly" (bake-regression), which
          # is a baselined check this job does not reproduce. Then merge once the
          # required checks are actually green.
          git add -- locale
          if git diff --cached --quiet; then
            echo "No changes from resolution (PR was already clean); using existing CI."
          else
            git commit -m "i18n: auto-heal translation PR (resolve + repair)"
            git push origin "HEAD:$HEAD_REF"
          fi

          # Wait for the OTHER required checks, then merge. We POLL with a hard cap
          # (never `gh pr checks --watch`, which blocked until GitHub's 6h job
          # timeout). The required set is decided by the unit-tested merge_gate.py and
          # never includes this workflow's own checks (that would deadlock). Do NOT
          # delete the `weblate` branch -- Weblate reuses it.
          delete_flag="--delete-branch"
          if [ "$HEAD_REF" = "weblate" ]; then delete_flag=""; fi
          require=(--require validate --require "Verify translations deploy cleanly")
          for _ in $(seq 1 30); do          # ~15 min cap (30 x 30s)
            checks="$(gh pr checks "$PR" --json name,bucket 2>/dev/null || echo '[]')"
            if printf '%s' "$checks" | python3 scripts/merge_gate.py "${require[@]}"; then
              gh pr merge "$PR" --squash $delete_flag \
                || echo "note: merge of PR #$PR did not complete (already merged / state changed)"
              exit 0
            fi
            if printf '%s' "$checks" | python3 scripts/merge_gate.py --mode settled "${require[@]}"; then
              gh pr comment "$PR" --body "Auto-heal resolved the conflict and pushed the result, but a required check did not pass. Leaving this PR open for a human."
              exit 0
            fi
            echo "Waiting for required checks on PR #$PR to register/complete..."
            sleep 30
          done
          gh pr comment "$PR" --body "Auto-heal resolved the conflict and pushed the result; required checks did not settle within the time budget. Leaving this PR open — the next sync (or a re-run) will retry the merge."
          echo "Required checks did not settle in time; left PR #$PR open."
