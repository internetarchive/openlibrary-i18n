name: Translate

# Nightly rather than on every openlibrary-pot-updated dispatch: a busy day of
# merges upstream used to start a batch per merge, and each batch's PRs and
# their checks held the org's shared Actions runners for hours. sync-pot.yml
# still follows each dispatch; this run picks up whatever it committed.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      language:
        description: "Debug: run for a single language only"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

# Two runs seconds apart (e.g. a manual run during the nightly one) would run
# side by side, compute the same date-based branch name and translate the same
# languages into it (#209). Queue the second run behind the first instead.
concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.get-batches.outputs.batches }}
    steps:
      # ref: main, not the triggering SHA: a run queued behind another (the
      # concurrency group) would otherwise plan against main from before the
      # earlier run's PRs merged (#317).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install babel pytest

      # Syncing here only sharpens the counts below; this job's tree is
      # thrown away and nothing from locale/ is handed to the translate job.
      - name: Pull and sync all languages
        run: |
          # The fresh messages.pot lives outside the checkout (see the translate job).
          echo "I18N_POT=$RUNNER_TEMP/pot/messages.pot" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pot"
          I18N_POT="$RUNNER_TEMP/pot/messages.pot" ./i18n pull --sync

      - name: Show incomplete languages
        run: ./i18n incomplete

      - name: Compute batches
        id: get-batches
        run: |
          if [ -n "${{ inputs.language }}" ]; then
            BATCHES='[["${{ inputs.language }}"]]'
          else
            BATCHES=$(./i18n batch | python3 -c "import json,sys; print(json.dumps(json.load(sys.stdin)['batches']))")
          fi
          echo "batches=$BATCHES" >> $GITHUB_OUTPUT
          echo "Batches: $BATCHES"

      # Hand over only the template, so every batch translates against the same
      # messages.pot even if sync-pot.yml has not committed it to main yet.
      - name: Upload messages.pot
        uses: actions/upload-artifact@v4
        with:
          name: messages-pot
          path: ${{ env.I18N_POT }}

  translate:
    needs: plan
    if: needs.plan.outputs.batches != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Persist OL_BOT_I18N_PAT (not the default GITHUB_TOKEN) as the git
          # credential: a push authed with GITHUB_TOKEN does not trigger the
          # pull_request checks the merge gate waits on, so the bot PR never
          # goes green and nothing self-merges. #151.
          token: ${{ secrets.OL_BOT_I18N_PAT }}
          # Current main, not the triggering SHA, so the agent starts from a
          # clean tree that already holds every merged translation (#317).
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install babel pytest

      # The template goes to runner.temp, outside the checkout, and the agent
      # reads it through I18N_POT. Unpacking synced .po files over the checkout
      # (as this step used to) left every locale dirty at session start (#322),
      # and when the checkout was stale it hid translations main already had
      # (#317). The agent now syncs only its own languages, after branching.
      - name: Download messages.pot
        uses: actions/download-artifact@v4
        with:
          name: messages-pot
          path: ${{ runner.temp }}/pot

      - name: Check the working tree is clean
        run: git diff --exit-code --stat

      - name: Translate batch
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.OL_BOT_I18N_PAT }}
          I18N_POT: ${{ runner.temp }}/pot/messages.pot
        with:
          prompt: "@i18n-translation-instructions.md\n\nYour batch: ${{ toJSON(matrix.batch) }}"
          # Pin the model. claude-code-action@v1 has no `model` input, so the id
          # goes through claude_args (passed straight to the claude CLI). Without
          # a pin the CLI default drifted to `claude-sonnet-5-5`, which returned
          # 404 model_not_found in this pipeline's runs from 2026-09-28 on (e.g.
          # run 36623332913: "may not exist or you may not have access to it"),
          # so none completed. The last completing run (36095667073, 2026-09-25)
          # used `claude-sonnet-5`; pin that known-good id so a default change
          # cannot silently break or alter the pipeline.
          claude_args: "--max-turns 750 --permission-mode bypassPermissions --model claude-sonnet-5"
          show_full_output: true
          claude_code_oauth_token: ${{ secrets.OL_BOT_CLAUDE_OAUTH_TOKEN }}
          github_token: ${{ secrets.OL_BOT_I18N_PAT }}

      - name: Merge translation PRs that pass required checks
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This repo has allow_auto_merge:false and main has no branch
          # protection, so nothing but this gate stops unreviewed machine output
          # from landing. Merge a PR ONLY once both required checks -- validate
          # (validate-pr.yml) and bake-regression -- have actually passed; a
          # failing, pending, skipped or absent check never merges. There is no
          # blind fallback (the old `--auto || plain-merge` could merge unchecked
          # since --auto is disabled here). scripts/merge_gate.py makes the
          # pass/no-pass decision and is unit-tested in tests/test_merge_gate.py.
          gh pr list \
            --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("i18n/ai-")) | .number' \
          | while IFS= read -r pr; do
              echo "::group::PR #$pr"
              # The checks run on the PR, not in this job, and may still be
              # starting when we get here. Poll (bounded) until a verdict exists:
              # `--watch` waits out checks that are *registered* and still
              # running; `--mode settled` tells "not reported yet / still
              # pending" (keep waiting) from "finished but not all passing"
              # (stop now, leave the PR open). A PR whose checks never register
              # is simply left for a later dispatch -- never merged unchecked.
              for _ in $(seq 1 20); do
                gh pr checks "$pr" --watch --interval 30 >/dev/null 2>&1 || true
                checks="$(gh pr checks "$pr" --json name,bucket 2>/dev/null || echo '[]')"
                if printf '%s' "$checks" \
                     | python3 scripts/merge_gate.py --require validate --require "Verify translations deploy cleanly"; then
                  # Another matrix shard runs this same loop, so a merge may
                  # already have happened; tolerate that without aborting (set -e).
                  gh pr merge "$pr" --squash --delete-branch \
                    || echo "note: merge of PR #$pr did not complete (already merged, or its state changed)"
                  break
                fi
                if printf '%s' "$checks" \
                     | python3 scripts/merge_gate.py --mode settled --require validate --require "Verify translations deploy cleanly"; then
                  echo "Leaving PR #$pr open: its required checks finished but did not all pass."
                  break
                fi
                echo "Waiting for required checks on PR #$pr to register/complete..."
                sleep 30
              done
              echo "::endgroup::"
            done
