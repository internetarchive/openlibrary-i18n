name: Validate translations

on:
  pull_request:
    paths:
      - "locale/**"
      - "messages.pot"
      - "i18n"
      - "tests/test_i18n.py"
      - "tests/conftest.py"
      - "tests/test_locale_option.py"
      - "scripts/po_same_content.py"
      - "tests/test_po_same_content.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scope guard can find this PR's merge-base off main.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install babel pytest

      - name: Detect changed languages
        id: changed-langs
        run: |
          git fetch origin ${{ github.base_ref }}
          LANGS=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep '^locale/' \
            | cut -d/ -f2 \
            | sort -u \
            | tr '\n' ' ')
          echo "langs=$LANGS" >> "$GITHUB_OUTPUT"
          echo "Changed languages: $LANGS"

      # A translation PR may only touch languages it actually translated. #188's
      # batch re-synced 5 languages that belonged to other PRs; when those merged
      # the batch went un-mergeably dirty and its real translations lingered.
      - name: Check scope (no stray languages)
        run: python ./i18n check-scope --base origin/${{ github.base_ref }}

      - name: Run test_po_files (HTML structure)
        run: |
          # Only test the languages this PR changed, so a PR is never failed for a
          # language it did not touch. --locale (tests/conftest.py, tested in
          # tests/test_locale_option.py) filters on each test's locale parameter;
          # the old `-k` substring match also hit msgid text and ran nearly every
          # language for codes like tr and es (#302).
          LANGS="${{ steps.changed-langs.outputs.langs }}"
          if [ -z "${LANGS// }" ]; then
            echo "No locale changes detected — running full suite"
            python -m pytest tests/test_po_files.py -q
          else
            echo "Testing languages: $LANGS"
            python -m pytest tests/test_po_files.py --locale "$LANGS" -q
          fi

      # Every locale, not the changed-languages list: plural and placeholder
      # regressions, and the toolbox's own checks. The sync CLI tests run on a
      # temp copy (#44), so nothing here touches a real locale file.
      - name: Run plural-form and toolbox tests
        run: |
          python -m pytest tests/test_plural_forms.py tests/test_i18n.py tests/test_locale_option.py \
            tests/test_po_same_content.py -q

      - name: Validate format strings
        run: |
          LANGS="${{ steps.changed-langs.outputs.langs }}"
          python - <<'EOF'
          import sys
          from pathlib import Path
          from babel.messages.pofile import read_po
          sys.path.insert(0, str(Path('tests')))
          from validators import validate

          changed = "${{ steps.changed-langs.outputs.langs }}".split()
          locale_dir = Path("locale")
          langs = changed if changed else sorted(p.name for p in locale_dir.iterdir() if p.is_dir())

          errors_found = False
          for lang in langs:
              po_path = locale_dir / lang / "messages.po"
              with open(po_path, "rb") as f:
                  catalog = read_po(f)
              lang_errors = []
              for msg in catalog:
                  if not msg.id:
                      continue
                  errs = validate(msg, catalog)
                  if errs:
                      lang_errors.append((msg.id, errs))
              if lang_errors:
                  print(f"\n{lang}: {len(lang_errors)} error(s)")
                  for msgid, errs in lang_errors[:10]:
                      print(f"  msgid: {msgid!r}")
                      for e in errs:
                          print(e)
                  errors_found = True
              else:
                  print(f"{lang}: OK")

          if errors_found:
              sys.exit(1)
          EOF
